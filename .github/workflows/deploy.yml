# ============================================================
# DevOps Lab 1 — CI/CD Pipeline với GitHub Actions
# Tự động deploy website lên GitHub Pages mỗi khi push code
# ============================================================

name: Deploy to GitHub Pages

# === Khi nào pipeline chạy? ===
on:
  push:
    branches: [main]       # Chạy khi push lên nhánh main
  workflow_dispatch:        # Cho phép chạy thủ công từ GitHub UI

# Cho phép action tạo và cập nhật nhánh gh-pages.
# permissions phải ở cấp workflow hoặc job, không nằm trong steps.
permissions:
  contents: write

# Các lần deploy chạy lần lượt để không ghi đè lẫn nhau.
concurrency:
  group: github-pages
  cancel-in-progress: false

# === Các job trong pipeline ===
jobs:
  # Job 1: Build & Deploy
  build-and-deploy:
    runs-on: ubuntu-latest   # Chạy trên máy ảo Ubuntu (free)

    steps:
      # Step 1: Checkout code từ GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Kiểm tra HTML cơ bản
      - name: Validate HTML
        run: |
          echo "Checking index.html exists..."
          if [ -s "index.html" ]; then
            echo "index.html found!"
            echo "File size: $(wc -c < index.html) bytes"
          else
            echo "index.html is missing or empty!"
            exit 1
          fi

      # Step 3: Chỉ đưa nội dung website vào thư mục xuất bản.
      - name: Prepare Website
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      # Step 4: Deploy lên GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "Auto-deploy from CI pipeline"
